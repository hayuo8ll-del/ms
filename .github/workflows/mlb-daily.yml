name: MLB Daily Report

# Fetches Japanese MLB players' season stats once a day and commits the
# generated Markdown report under backend/reports/. Also runnable on demand
# via the "Run workflow" button (workflow_dispatch).
on:
  schedule:
    # 13:00 UTC ≈ 22:00 JST — after the previous day's US games have settled.
    # Adjust the minute/hour here to change when the report is refreshed.
    - cron: '0 13 * * *'
  workflow_dispatch:

# Allow the job to push the generated report back to the repository.
permissions:
  contents: write

concurrency:
  group: mlb-daily
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate MLB report
        working-directory: backend
        run: python3 scheduler.py --mlb-report

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update Japanese MLB player stats report ($(date -u +%Y-%m-%d))"
            git push
          fi
