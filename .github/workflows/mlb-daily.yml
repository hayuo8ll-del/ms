name: MLB Daily Report

# Fetches Japanese MLB players' season + latest-game stats once a day, commits
# the Markdown report (backend/reports/) and the web page (mlb/index.html) back
# to main, then republishes the site so the update actually goes live.
#
# Why the separate publish job: this repository's Pages source is "GitHub
# Actions", so a commit alone publishes nothing. On top of that, commits pushed
# with GITHUB_TOKEN never trigger `on: push`, so pages.yml would not fire by
# itself here — it has to be called explicitly (see the publish job below).
on:
  schedule:
    # 13:00 UTC ≈ 22:00 JST — after the previous day's US games have settled.
    # Adjust the minute/hour here to change when the report is refreshed.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate MLB report and web page
        working-directory: backend
        run: python3 scheduler.py --mlb-report

      - name: Commit and push report + page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/reports mlb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Japanese MLB stats ($(date -u +%Y-%m-%d))"
            git push
          fi

  # Republish the site (study app + MLB page) so the freshly committed
  # mlb/index.html is actually served. pages.yml checks out main, so it picks up
  # the commit the build job just pushed.
  publish:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Nobody watches the Actions tab: in August this job failed for three days
  # running (Pages had been disabled) and the site stayed down unnoticed.
  # Opening an issue turns a silent failure into an email.
  notify-failure:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="MLB日次ジョブが失敗しています"
          body="日次ジョブ (MLB Daily Report) が失敗しました。
          サイトの更新が止まっている可能性があります。

          失敗したログ: $RUN_URL

          よくある原因:
          - GitHub Pages が無効になっている (リポジトリを Private にすると無効化されます)
          - MLB API が一時的に応答しない"

          # One issue per outage, not one per day: comment on the open one if
          # it already exists.
          existing=$(gh issue list --state open --label ci-failure \
            --search "$title in:title" --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "また失敗しました: $RUN_URL"
            echo "commented on issue #$existing"
          else
            gh label create ci-failure --color B60205 --description "自動ジョブの失敗" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label ci-failure
          fi
